name: Link check

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/content/**"
      - ".github/workflows/links.yml"
      - "lychee.toml"

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress "src/content/**/*.yaml"
          output: lychee/report.md
          fail: ${{ github.event_name == 'pull_request' }}
      - name: Track broken links in one issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
        run: |
          issue=$(gh issue list --label link-rot --state open --json number --jq '.[0].number // empty')
          if [ "$EXIT_CODE" != 0 ]; then
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file lychee/report.md
            else
              gh issue create --title "Broken catalog links" --label link-rot --body-file lychee/report.md
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "All catalog links resolve as of run ${{ github.run_id }}."
          fi
