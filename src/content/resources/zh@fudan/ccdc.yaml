kind: dataset
langs: [zh]
name:
  zh: 复旦大学中华文明数据中心・复旦大学东亚语言数据中心
link: http://ccdc.fudan.edu.cn/bases/index.jsp
description:
  ja: 中古音・上古音などはもちろん、方言地図は特色で、ユーザーで作る機能も持っている故、興味深い方言地図が多数存在する。また、言語調査の詳細データもあります。
  en: "Covers Middle and Old Chinese phonology, and its dialect maps are the highlight: users can build their own, so many maps of real interest exist. Detailed field-survey data is also available."
  zh: "除中古音、上古音等內容外，方言地圖是其特色，且提供使用者自製功能，因此有許多有趣的方言地圖。此外還有語言調查的詳細數據。"
