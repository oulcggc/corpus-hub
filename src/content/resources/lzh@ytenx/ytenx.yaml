description:
  ja: 『廣韻』『中原音韻』 『洪武正韻牋』『 分韻撮要』など音韻学必須古典籍の写真データや再構音があり、検索もとても便利です。
  en: "Carries photographic reproductions and reconstructed readings of the essential phonological classics — the Guangyun, Zhongyuan Yinyun, Hongwu Zhengyun Jian, and Fenyun Cuoyao — with very convenient search."
  zh: "收有《廣韻》《中原音韻》《洪武正韻牋》《分韻撮要》等音韻學必備古籍的書影與擬音資料，檢索也十分方便。"
