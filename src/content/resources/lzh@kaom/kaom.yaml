kind: dataset
langs: [lzh]
name:
  zh: 古音小鏡
creator: 顧國林
link: http://www.kaom.net/
description:
  ja: 中国語の専門家も激賞するサイトで、恐らく現在ネット上関係分野の一番豊富な検索ツールです。中国歴史言語学を研究する上で、必要な古典籍などの資料をまとめたサイトで、韻書、字書検索をはじめ、中国方言学、古代音韻（中古音14家、上古音7家の学者の再構音、詩経の押韻資料、日韓越の漢字音）、文字学（簡牘原文）、歴史言語学（同源字典、西蔵、蒙古、満州、侗泰、苗語などの周辺言語）、地名学など様々な分野の資料がこのサイトに蒐集されております。また、IPA Input Method や統計など有用なツールも備わっています。
  en: "A site that even specialists in Chinese praise highly — probably the richest search tool in the field anywhere online. It gathers the classical texts and other materials needed for Chinese historical linguistics: rime-book and character-dictionary search, Chinese dialectology, historical phonology (reconstructions by fourteen scholars for Middle Chinese and seven for Old Chinese, rhyme data from the Shijing, Sino-Japanese, Sino-Korean, and Sino-Vietnamese readings), paleography (bamboo and wooden slip texts), historical linguistics (cognate dictionaries and neighboring languages such as Tibetan, Mongolic, Manchu, Kam–Tai, and Hmong), toponymy, and more. It also carries useful tools such as an IPA input method and statistics."
