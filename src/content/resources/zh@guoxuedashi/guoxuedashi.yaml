name:
  zh: 国学大师
link: http://www.guoxuedashi.com/
description:
  ja: 使用には登録が必要。有料無料不明。二万種以上の中国古典籍の集成と六十種辞書（現代辞書から書道字典）で二十万以上の漢字の検索が　できる、中国インターネット上一番豊富な辞書と古典籍サイトです。
  en: "Registration required; whether it charges is unclear. With a collection of over twenty thousand Chinese classical texts and sixty dictionaries, from modern ones to calligraphy dictionaries, searchable across more than two hundred thousand characters, it is the richest dictionary and classical-text site on the Chinese internet."
